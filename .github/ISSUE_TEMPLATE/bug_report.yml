name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you saw instead. Screenshots help for rendering issues.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest code or steps that show the problem. Include the TLEs involved if relevant.
      render: ts
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Library version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: cesium
    attributes:
      label: CesiumJS version
      placeholder: 1.145.0
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Firefox 150 on Ubuntu 26.04
